name: Test and Lint

on:
  push:
    branches: [main, develop]
    # Release tags get verified too: nothing else gates a tag push.
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # go.mod requires go >= 1.26.0 and setup-go sets GOTOOLCHAIN=local, so
        # anything below 1.26.x fails at `go mod download`. Track the oldest
        # supported version plus the newest stable one.
        go-version: [1.26.x, 1.27.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Run go vet
        run: go vet ./...

      - name: Run gofmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files need formatting:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run goimports check
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          if [ "$(goimports -l . | wc -l)" -gt 0 ]; then
            echo "The following files need import formatting:"
            goimports -l .
            exit 1
          fi

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned: builds older than v2.14.0 cannot decode Go 1.27 export data
          # (version 5) and fail this step with typecheck errors.
          version: v2.14.0
          args: --timeout=5m --disable=errcheck

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Deliberately the oldest supported Go: gosec (v2.29.0) bundles a
          # golang.org/x/tools that cannot decode Go 1.27 export data, so every
          # package reports type errors and the scan exits 1 without findings.
          # Bump this once gosec supports Go 1.27.
          go-version: 1.26.x

      - name: Run Gosec Scan
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt=sarif -out=gosec.sarif ./...

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "gosec.sarif"

  modules:
    name: Nested Modules (${{ matrix.module }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Root `./...` walks none of these modules, so without this job their
        # go.mod drift and broken builds reach main unnoticed.
        module:
          - reader/k8s
          - examples/file-json
          - examples/file-xml
          - examples/flags
          - examples/http-yaml
          - examples/k8s-yaml
          - examples/redis-hash
          - examples/redis-ini

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Check go.mod is tidy
        working-directory: ${{ matrix.module }}
        run: go mod tidy -diff

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Run go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...
